name: Referência de desempenho

on:
  workflow_dispatch:
    inputs:
      medida:
        description: 'referencias (as cinco fases paradas) ou empurrar (empurrando carrinho, caixote e ventilador)'
        type: choice
        options: [referencias, empurrar]
        default: referencias
      outro:
        description: 'empurrar: o commit comparado com este (o head do PR; este é o main publicado)'
        type: string
        default: ''
  # Permite validar a instalação antes de este workflow existir no main.
  # O código do PR é executado só em runner sem credenciais e com leitura.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desempenho.yml'
      - 'tools/scripts/measure-performance.mjs'
      - 'tools/scripts/compare-performance.mjs'
      - 'tools/scripts/test-performance-infra.mjs'
      - 'tools/scripts/lib/performance-*.mjs'

permissions:
  contents: read

concurrency:
  group: desempenho-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build único e infraestrutura de medição
    if: github.event_name != 'workflow_dispatch' || inputs.medida != 'empurrar'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      MEASURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Conferir identidade do checkout
        run: test "$(git rev-parse HEAD)" = "$MEASURE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gerar um build para os cinco pares de referências
        run: npm run build
      - name: Validar análise e provas negativas da infraestrutura
        run: node --test tools/scripts/test-performance-infra.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desempenho-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
  referencias:
    name: Referências A e B — ${{ matrix.fase }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fase: [fase1, fase2, fase3, fase4, fase5]
    env:
      CI: 'true'
      MEASURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PERFORMANCE_LEVEL: ${{ matrix.fase }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Conferir identidade do checkout
        run: test "$(git rev-parse HEAD)" = "$MEASURE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: desempenho-build
          path: dist/
      - name: Instalar Chromium fixado no lockfile
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Referência A com qualidade completa
        run: node tools/scripts/measure-performance.mjs
        env:
          PERFORMANCE_REFERENCE: a
      - name: Referência B com novo navegador no mesmo runner
        run: node tools/scripts/measure-performance.mjs
        env:
          PERFORMANCE_REFERENCE: b
      - name: Guardar dados brutos e relatório mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desempenho-${{ matrix.fase }}
          path: shots/performance/
          if-no-files-found: error
          retention-days: 14
  empurrar:
    # Retorno do usuário: "toda vez que eu vou empurrar algum item tem uma queda de performance grande". Os dois builds
    # (este commit, o main publicado, e o `outro`, o head do PR) no MESMO runner, sem minificar (o perfil de CPU com os
    # nomes das funções), medidos em A/B/A/B com cada modelo das dogs (tools/scripts/measure-push.mjs).
    name: Empurrando — tempo de quadro e perfil
    if: github.event_name == 'workflow_dispatch' && inputs.medida == 'empurrar' && inputs.outro != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.outro }}
          path: outro
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: outro
      - name: Builds sem minificar (sem o prebuild de testes)
        run: |
          npx vite build --minify false --outDir dist-main
          (cd outro && npx vite build --minify false --outDir ../dist-pr)
      - name: Instalar Chromium fixado no lockfile
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: A — main publicado (modelo atual; ?dogs=novo, o novo)
        run: node tools/scripts/measure-push.mjs --dist dist-main --label main-1 --queries "padrao,dogs=novo"
      - name: B — PR (modelo novo; ?dogs=atual, o atual), com perfil de CPU
        if: always()
        run: node tools/scripts/measure-push.mjs --dist dist-pr --label pr-1 --queries "padrao,dogs=atual" --profile
      - name: A de novo
        if: always()
        run: node tools/scripts/measure-push.mjs --dist dist-main --label main-2 --queries "padrao,dogs=novo" --profile
      - name: B de novo
        if: always()
        run: node tools/scripts/measure-push.mjs --dist dist-pr --label pr-2 --queries "padrao,dogs=atual"
      - name: Guardar os relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desempenho-empurrar
          path: shots/push/
          if-no-files-found: warn
          retention-days: 14
  agregar:
    name: Conferir cinco pares e gerar referência durável
    needs: [build, referencias]
    if: always() && needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.medida != 'empurrar')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desempenho-fase*
          merge-multiple: true
          path: shots/performance/
      - name: Exigir cinco pares completos e comparar limites por fase
        run: node tools/scripts/compare-performance.mjs
      - name: Guardar dados brutos e relatório mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desempenho-cinco-fases
          path: shots/performance/
          if-no-files-found: error
          retention-days: 14
