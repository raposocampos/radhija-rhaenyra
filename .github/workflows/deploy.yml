name: Publicar versão validada

on:
  workflow_run:
    workflows: [CI e prévias]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Execução aprovada do CI para publicar novamente
        required: true
        type: string

permissions:
  contents: read

jobs:
  identificar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.run.outputs.mode }}
      pr: ${{ steps.run.outputs.pr }}
      head: ${{ steps.run.outputs.head }}
      base: ${{ steps.run.outputs.base }}
      run: ${{ steps.run.outputs.run }}
      attempt: ${{ steps.run.outputs.attempt }}
    steps:
      # workflow_run carrega este workflow do main. Nunca fazer checkout do PR aqui.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: node tools/deploy/resolve-run.mjs

  publicar:
    needs: identificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
      statuses: write
      pages: write
      id-token: write
    concurrency:
      group: pages-site
      cancel-in-progress: false
      queue: max
    # No servidor, ambos os ambientes permitem apenas refs de código confiável.
    environment:
      name: ${{ needs.identificar.outputs.mode == 'preview' && 'preview' || 'github-pages' }}
      url: ${{ steps.address.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ needs.identificar.outputs.run }}
      EXPECTED_HEAD: ${{ needs.identificar.outputs.head }}
      EXPECTED_BASE: ${{ needs.identificar.outputs.base }}
      EXPECTED_ATTEMPT: ${{ needs.identificar.outputs.attempt }}
      SITE_MODE: ${{ needs.identificar.outputs.mode }}
      PR_NUMBER: ${{ needs.identificar.outputs.pr }}
      PREVIEW_VERSION: ${{ needs.identificar.outputs.run }}-${{ needs.identificar.outputs.attempt }}
    steps:
      - name: Marcar publicação pendente no PR
        if: env.SITE_MODE == 'preview'
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" \
            -f state=pending -f context=publicar-site -f description='Preparando prévia do CI aprovado' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Revalidar após fila ou aprovação
        run: node source/tools/deploy/resolve-run.mjs
      - uses: actions/checkout@v6
        with:
          ref: pages-state
          path: published
      # Download específico por execução; tratar o conteúdo somente como dados.
      - uses: actions/download-artifact@v4
        with:
          name: game-build
          path: build
          run-id: ${{ needs.identificar.outputs.run }}
          github-token: ${{ github.token }}
      - name: Conferir identidade do artefato
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync('build/version.json', 'utf8'));
          if (v.head !== process.env.EXPECTED_HEAD || (v.base || '') !== process.env.EXPECTED_BASE ||
              v.run !== process.env.CI_RUN_ID || v.attempt !== process.env.EXPECTED_ATTEMPT) {
            throw new Error('Artefato não corresponde à execução e à versão aprovadas.');
          }
          NODE
      - name: Preparar o site preservando as outras versões
        run: node source/tools/deploy/prepare-site.mjs published/site build
      - name: Endereço da versão
        id: address
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          url="$base"
          if [ -n "$PR_NUMBER" ]; then url="${base}previews/pr-${PR_NUMBER}/${PREVIEW_VERSION}/"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: published/site
      - name: Salvar o estado estático
        working-directory: published
        run: |
          git config user.name raposocampos
          git config user.email 91505378+raposocampos@users.noreply.github.com
          git add -- site
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza site: CI $CI_RUN_ID/$EXPECTED_ATTEMPT"
            git push origin HEAD:pages-state
          fi
      - name: Publicar no Pages
        uses: actions/deploy-pages@v4
      - name: Conferir a versão publicada
        env:
          SITE_URL: ${{ steps.address.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          let ready = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`${process.env.SITE_URL}version.json?run=${process.env.CI_RUN_ID}`, { signal: AbortSignal.timeout(10000) });
              const v = await response.json();
              if (response.ok && v.head === process.env.EXPECTED_HEAD && v.run === process.env.CI_RUN_ID && v.attempt === process.env.EXPECTED_ATTEMPT) {
                ready = true;
                break;
              }
            } catch { /* Aguardar propagação do Pages. */ }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!ready) throw new Error('A versão esperada ainda não está acessível no Pages.');
          NODE
      - name: Mostrar o link
        env:
          SITE_URL: ${{ steps.address.outputs.url }}
        run: echo "### [Abrir a versão publicada]($SITE_URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Informar resultado obrigatório no PR
        if: always() && env.SITE_MODE == 'preview'
        env:
          JOB_STATUS: ${{ job.status }}
          SITE_URL: ${{ steps.address.outputs.url }}
        run: |
          state=failure
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" = success ]; then state=success; url="$SITE_URL"; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" \
            -f "state=$state" -f context=publicar-site -f description='Resultado da publicação da prévia' -f "target_url=$url"
