name: CI e prévias

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # O build roda antes "npm run typecheck" e "npm test" (prebuild).
      - run: npm run build
      - name: Identificar a versão testada
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/version.json', JSON.stringify({
            commit: process.env.BUILD_COMMIT,
            head: process.env.BUILD_HEAD,
            base: process.env.BUILD_BASE || null,
            run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: dist
          retention-days: 7
          if-no-files-found: error

  publicar-site:
    needs: testes-e-build
    # Forks recebem CI, mas nunca token de escrita ou publicação automática.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    # Ler e atualizar pages-state dentro do mesmo lock evita perder outra prévia.
    concurrency:
      group: pages-site
      cancel-in-progress: false
      queue: max
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'github-pages' }}
      url: ${{ steps.address.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Conferir se a versão ainda é atual
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pr = JSON.parse(readFileSync('current-pr.json', 'utf8'));
          if (pr.state !== 'open' || pr.head.sha !== process.env.EXPECTED_HEAD || pr.base.sha !== process.env.EXPECTED_BASE) {
            throw new Error('PR mudou ou foi fechado. Atualize o branch e execute o CI novamente.');
          }
          NODE
          else
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_HEAD"
          fi
      - uses: actions/checkout@v6
        with:
          ref: pages-state
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: game-build
          path: build
      - name: Preparar o site preservando as outras versões
        env:
          SITE_MODE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node source/tools/deploy/prepare-site.mjs published/site build
      - name: Endereço da versão
        id: address
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          url="$base"
          if [ -n "$PR_NUMBER" ]; then url="${base}previews/pr-${PR_NUMBER}/${PREVIEW_VERSION}/"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: published/site
      - name: Salvar o estado estático
        working-directory: published
        run: |
          git config user.name raposocampos
          git config user.email 91505378+raposocampos@users.noreply.github.com
          git add -- site
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza site: execução $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            git push origin HEAD:pages-state
          fi
      - name: Publicar no Pages
        uses: actions/deploy-pages@v4
      - name: Conferir a versão publicada
        env:
          SITE_URL: ${{ steps.address.outputs.url }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          let ready = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`${process.env.SITE_URL}version.json?run=${process.env.GITHUB_RUN_ID}`, { signal: AbortSignal.timeout(10000) });
              const version = await response.json();
              if (response.ok && version.head === process.env.EXPECTED_HEAD && version.run === process.env.GITHUB_RUN_ID && version.attempt === process.env.GITHUB_RUN_ATTEMPT) {
                ready = true;
                break;
              }
            } catch { /* Aguardar propagação do Pages. */ }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!ready) throw new Error('A versão esperada ainda não está acessível no Pages.');
          NODE
      - name: Mostrar o link
        env:
          SITE_URL: ${{ steps.address.outputs.url }}
        run: |
          echo "### [Abrir a versão publicada]($SITE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Fonte testada: $GITHUB_SHA. PRs aguardam aprovação do usuário antes de integrar e publicar em produção." >> "$GITHUB_STEP_SUMMARY"
