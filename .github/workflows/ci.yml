# Integração contínua (só roda se o repositório estiver no GitHub): tipos, testes rápidos e build.
# As partidas no navegador (npm run test:e2e) ficam de fora: dependem do Chrome do Windows; rode-as localmente.
name: CI

on:
  push:
  pull_request:

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # O build roda antes "npm run typecheck" e "npm test" (prebuild).
      - run: npm run build
