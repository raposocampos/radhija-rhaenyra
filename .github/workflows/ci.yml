name: CI e prévias

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Histórico completo: a versão do jogo conta os commits de primeiro pai do main (docs/ENTREGA.md).
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Exporta GAME_VERSION_INFO: o Vite embute a versão no menu e o version.json grava version e build.
      - name: Calcular a versão do jogo
        env:
          VERSION_PR: ${{ github.event.pull_request.number }}
          VERSION_BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/deploy/version.mjs --github-env
      # O build roda antes "npm run typecheck" e "npm test" (prebuild).
      - run: npm run build
      - name: Identificar a versão testada
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/version.json', JSON.stringify({
            // version, build, pr e label (e next na prévia): o mesmo que o menu mostra.
            ...JSON.parse(process.env.GAME_VERSION_INFO),
            commit: process.env.BUILD_COMMIT,
            head: process.env.BUILD_HEAD,
            base: process.env.BUILD_BASE || null,
            run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: dist
          retention-days: 7
          if-no-files-found: error
