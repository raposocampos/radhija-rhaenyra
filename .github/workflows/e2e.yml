name: E2E manual

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Partida a verificar
        type: choice
        default: todas
        options: [todas, fase1, fase2, fase3, fase4, fase5, controle, regressoes, pulo, bafo]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  infra-build:
    name: Infraestrutura e smoke do build
    if: inputs.suite == 'todas'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gerar build de produção desta execução E2E
        run: npm run build
      - name: Instalar Chromium e dependências Linux
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Provar que erros do navegador reprovam o E2E
        run: node --test tools/scripts/test-e2e-infra.mjs
      - name: Verificar build e fases sob demanda em subcaminho de prévia
        run: node tools/scripts/smoke-build.mjs
  partidas:
    name: Partida — ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'todas' && '["fase1","fase2","fase3","fase4","fase5","controle","regressoes","pulo","bafo"]' || format('["{0}"]', inputs.suite)) }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar Chromium e dependências Linux
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Jogar e verificar
        run: npm run test:e2e -- --only "${{ matrix.suite }}"
      - name: Instalar codificador do vídeo de revisão
        if: matrix.suite == 'fase4'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Comparar pombos com a base (qualidade visual completa)
        if: matrix.suite == 'fase4'
        run: node tools/scripts/capture-pigeons.mjs
      - name: Guardar capturas para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ matrix.suite }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
