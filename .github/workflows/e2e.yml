name: E2E manual

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Partida a verificar
        type: choice
        default: todas
        options: [todas, fase1, fase2, fase3, fase4, fase5, controle, regressoes, pulo, bafo, porcos, expresso, lambe, toque, lavanderia, menu, extras, biblioteca, quintal, canil, recursos, carregamento]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  infra-build:
    name: Infraestrutura e smoke do build
    if: inputs.suite == 'todas' || inputs.suite == 'expresso' || inputs.suite == 'lambe'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      # protótipos de desenvolvimento conferidos pelo id no build (lista separada por vírgula). Nenhum agora:
      # as fases 6 e 7 estão na campanha e o smoke confere os links ?level=fase6 / ?level=fase7 de qualquer modo.
      SMOKE_DEV_LEVEL: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gerar build de produção desta execução E2E
        run: npm run build -- --manifest
      - name: Instalar Chromium e dependências Linux
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Provar que erros do navegador reprovam o E2E
        run: node --test tools/scripts/test-e2e-infra.mjs
      - name: Verificar build e fases sob demanda em subcaminho de prévia
        run: node tools/scripts/smoke-build.mjs
      - name: Verificar recuperação de carregamento e aba antiga
        run: node tools/scripts/test-load-recovery.mjs
      - name: Guardar capturas da recuperação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-recuperacao
          path: shots/load-recovery/
          if-no-files-found: ignore
          retention-days: 7
  recursos:
    name: Recursos gráficos após trocas de fase
    if: inputs.suite == 'todas' || inputs.suite == 'recursos' || inputs.suite == 'expresso' || inputs.suite == 'lambe'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      # protótipos de fases novas entram juntos no catálogo (devCatalog) e ganham uma captura extra do cenário.
      # Nenhum agora: a medição normal já percorre as sete fases da campanha.
      MEASURE_DEV_LEVELS: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gerar build de produção desta medição
        run: npm run build
      - name: Instalar Chromium e dependências Linux
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Medir recursos com qualidade gráfica completa
        run: |
          if [ -z "$MEASURE_DEV_LEVELS" ]; then
            node tools/scripts/measure-resources.mjs
          else
            for level in $MEASURE_DEV_LEVELS; do
              MEASURE_DEV_LEVEL="$level" node tools/scripts/measure-resources.mjs
              mv shots/resources "shots/resources-$level"
            done
          fi
      - name: Guardar medições e capturas mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursos-graficos
          path: shots/resources*/
          if-no-files-found: error
          retention-days: 7
  # Estresse do primeiro boot (fora de "todas"): cada rodada sobe Vite e navegador novos e abre uma fase frio e
  # quente. Lotes 0–3: 25 rodadas, uma por vez, com o cache de dependências do Vite apagado a cada rodada (otimizador
  # frio, como na primeira suíte de cada job); lotes 4–7: 36 rodadas, três ao mesmo tempo (disputa de CPU). Reproduz
  # o travamento intermitente do primeiro carregamento com a sonda de diagnóstico (tools/scripts/lib/hang-probe.mjs);
  # serve também para confirmar uma correção. Ver docs/ARQUITETURA.md §10.
  carregamento:
    if: inputs.suite == 'carregamento'
    name: Carregamentos repetidos — lote ${{ matrix.lote }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lote: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar Chromium e dependências Linux
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Abrir fases em navegadores novos (boot frio e quente)
        run: node tools/scripts/stress-boot.mjs --offset ${{ matrix.lote }} --rounds ${{ matrix.lote >= 4 && 36 || 25 }} --parallel ${{ matrix.lote >= 4 && 3 || 1 }} ${{ matrix.lote < 4 && '--cold-deps' || '' }}
      - name: Guardar diagnóstico e registro do navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carregamento-${{ matrix.lote }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
  partidas:
    if: inputs.suite != 'recursos' && inputs.suite != 'carregamento'
    name: Partida — ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'todas' && '["fase1","fase2","fase3","fase4","fase5","controle","regressoes","pulo","bafo","porcos","expresso","lambe","toque","lavanderia","menu","extras","biblioteca","quintal","canil"]' || format('["{0}"]', inputs.suite)) }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar Chromium e dependências Linux
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Jogar e verificar
        run: npm run test:e2e -- --only "${{ matrix.suite }}"
      - name: Instalar codificador do vídeo de revisão
        if: matrix.suite == 'fase4'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Comparar pombos com a base (qualidade visual completa)
        if: matrix.suite == 'fase4'
        run: node tools/scripts/capture-pigeons.mjs
      - name: Capturas do impulso na parede para revisão (qualidade visual completa)
        if: always() && matrix.suite == 'pulo'
        run: node tools/scripts/capture-parede.mjs
      - name: Capturas dos porquinhos para revisão (qualidade visual completa)
        if: always() && matrix.suite == 'porcos'
        run: node tools/scripts/capture-porcos.mjs
      - name: Capturas da lavanderia (fase 8) para revisão (qualidade visual completa)
        if: always() && matrix.suite == 'lavanderia'
        run: node tools/scripts/capture-lavanderia.mjs
      - name: Capturas da biblioteca (fase 9) para revisão (qualidade visual completa)
        if: always() && matrix.suite == 'biblioteca'
        run: node tools/scripts/capture-biblioteca.mjs
      - name: Capturas da festa no quintal (fase 10) para revisão (qualidade visual completa)
        if: always() && matrix.suite == 'quintal'
        run: node tools/scripts/capture-quintal.mjs
      - name: Capturas dos extras para revisão (qualidade visual completa)
        if: always() && matrix.suite == 'extras'
        run: node tools/scripts/capture-extras.mjs
      - name: Capturas do Lambe-Lambe para revisão (qualidade visual completa)
        if: always() && matrix.suite == 'lambe'
        run: node tools/scripts/capture-lambe.mjs
      - name: Capturas dos modelos das dogs (atual × novo) para revisão (qualidade visual completa)
        if: always() && matrix.suite == 'canil'
        run: node tools/scripts/capture-modelos.mjs
      - name: Capturas do celular e do PC para revisão (qualidade de cada aparelho)
        if: always() && matrix.suite == 'toque'
        run: node tools/scripts/capture-celular.mjs
      - name: Guardar capturas para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ matrix.suite }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
