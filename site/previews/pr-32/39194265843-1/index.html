<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- celular: sem zoom por gesto e ocupando a área do entalhe (o HUD respeita as áreas seguras) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2118" />
    <meta name="description" content="Radhija &amp; Rhaenyra — uma pequena aventura 3D em fases com duas cachorrinhas: Operação Cenoura, Operação Bolinha e Operação Pantufa. Teclado, controle ou toque no celular." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- "Adicionar à tela inicial": abre em tela cheia e deitado -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Radhija &amp; Rhaenyra" />
    <title>Radhija &amp; Rhaenyra</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2118; }
      /* toque: nada de rolar, puxar para atualizar, zoom por gesto ou menu de toque longo */
      html, body { touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
      #app { position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #loading {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 40%, #f6c894 0%, #e59a62 55%, #8a4f33 100%);
        color: #fff6e6; font: 600 18px/1.3 system-ui, sans-serif; letter-spacing: .02em;
        transition: opacity .6s ease;
      }
      #loading.is-done { opacity: 0; pointer-events: none; }
      #loading .box { display: grid; justify-items: center; gap: 14px; text-shadow: 0 2px 0 #4a3426; }
      #loading .title { font-size: 30px; font-weight: 800; }
      #loading .paws { display: flex; gap: 10px; }
      #loading .paws i {
        width: 12px; height: 12px; border-radius: 50%; background: #fff6e6; box-shadow: 0 2px 0 #4a3426;
        animation: rr-hop 1s ease-in-out infinite;
      }
      #loading .paws i:nth-child(2) { animation-delay: .15s; }
      #loading .paws i:nth-child(3) { animation-delay: .3s; }
      @keyframes rr-hop { 0%, 100% { transform: translateY(0); opacity: .55; } 40% { transform: translateY(-9px); opacity: 1; } }
    </style>
    <script type="module" crossorigin src="./assets/main-aNoVBcFy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-BC5TmAXw.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="loading" aria-live="polite">
      <div class="box">
        <div class="title">Radhija &amp; Rhaenyra</div>
        <div class="paws"><i></i><i></i><i></i></div>
        <div>Preparando o jardim…</div>
      </div>
    </div>
  </body>
</html>
